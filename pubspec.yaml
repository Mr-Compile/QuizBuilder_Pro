name: quizbuilder_pro
description: AI-Assisted Offline Quiz Management System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  lucide_icons_flutter: ^3.1.15
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  collection: ^1.18.0
  share_plus: ^12.0.2
  flutter_secure_storage: ^10.3.1
  fl_chart: ^0.66.0
  flutter_slidable: ^3.0.1
  flutter_svg: ^2.0.9
  pdf: ^3.10.7
  printing: ^5.13.1
  excel: ^4.0.3
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.16.0
  cross_file: ^0.3.4
  syncfusion_flutter_pdf: ^20.4.54

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  image: ^4.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/brain_icon.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brain_icon.png
  adaptive_icon_background: '#4F46E5'
  adaptive_icon_foreground: assets/brain_icon.png
