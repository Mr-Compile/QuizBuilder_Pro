name: quizbuilder_pro
description: AI-Assisted Offline Quiz Management System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.8.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  lucide_icons_flutter: ^3.1.15
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  collection: ^1.18.0
  share_plus: ^9.0.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  image: ^4.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/launcher_icon.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#10b981"
  adaptive_icon_foreground: "assets/launcher_icon.png"
